# CHANGE THESE VALUES BEFORE EXPOSING NOMAD BEYOND YOUR LAN.
# APP_KEY must be at least 16 characters or the admin container will not start.
# Generate one with: openssl rand -hex 32
# DB_PASSWORD and MYSQL_PASSWORD must match (they are the same credential,
# consumed by the admin and mysql containers respectively).
apiVersion: v1
kind: Secret
metadata:
  name: nomad-secrets
type: Opaque
stringData:
  APP_KEY: change-me-to-a-random-32-char-string
  DB_PASSWORD: change-me-nomad-db-password
  MYSQL_PASSWORD: change-me-nomad-db-password
  MYSQL_ROOT_PASSWORD: change-me-nomad-root-password
