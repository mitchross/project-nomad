# Plain Ingress for the Command Center. Replace hosts with your domain and set
# your ingressClassName. Uncomment the extra rules if you enable the matching
# components — their URLs must be browser-reachable (see README).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nomad
  annotations: {}
spec:
  # ingressClassName: nginx
  rules:
    - host: nomad.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nomad-admin
                port:
                  name: http
    # - host: cyberchef.example.com
