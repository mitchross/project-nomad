apiVersion: apps/v1
kind: Deployment
metadata:
  name: nomad-admin
spec:
  template:
    spec:
      containers:
        - name: admin
          env:
            # Cluster-internal URL — the admin talks to Kiwix's API directly;
            # users browse content through NOMAD's own Content Explorer.
            - name: KIWIX_URL
              value: http://kiwix:8080
