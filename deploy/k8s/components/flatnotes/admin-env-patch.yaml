apiVersion: apps/v1
kind: Deployment
metadata:
  name: nomad-admin
spec:
  template:
    spec:
      containers:
        - name: admin
          env:
            # BROWSER-FACING URL — becomes the "Open" link in the NOMAD UI. Edit it.
            - name: FLATNOTES_URL
              value: https://flatnotes.example.com
